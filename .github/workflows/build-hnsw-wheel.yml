name: Build portable hnsw CP312 Windows wheel

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wheel:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install build-only dependencies
        run: python -m pip install setuptools==80.9.0 wheel==0.46.2 pybind11==3.0.1 numpy==1.26.4
      - name: Build and verify official source wheel
        run: python scripts/build_hnsw_wheel.py --output hnsw-artifact
      - name: Verify wheel can write, persist and query
        shell: pwsh
        run: |
          python -m pip install --no-deps (Get-ChildItem hnsw-artifact/*.whl).FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/check_runtime_versions.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/check_hnsw_runtime.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $wheel = Get-ChildItem hnsw-artifact/*.whl
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $wheel.FullName).Hash.ToLowerInvariant()
          "Wheel: $($wheel.Name) SHA-256: $hash" >> $env:GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: chroma-hnswlib-0.7.3-cp312-win_amd64
          path: hnsw-artifact/
          if-no-files-found: error
          retention-days: 90
