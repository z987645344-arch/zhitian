name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      JWT_SECRET_KEY: ci-only-test-secret-not-for-production
      DEEPSEEK_API_KEY: ""
      TAVILY_API_KEY: ""

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Check tracked files for secrets
        shell: bash
        run: |
          if git ls-files | grep -Eq '(^|/)\.env$'; then
            echo "Tracked .env file detected"
            exit 1
          fi
          if git grep -nEI '(sk-[A-Za-z0-9_-]{20,}|tvly-[A-Za-z0-9_-]{20,})' -- .; then
            echo "Possible API key detected in tracked files"
            exit 1
          fi

      - name: Compile Python sources
        shell: bash
        run: |
          find . -type f -name '*.py' \
            -not -path './.venv/*' \
            -not -path './data/*' \
            -not -path './.git/*' \
            -print0 | xargs -0 python -m py_compile

      - name: Run offline test suite
        run: python -m pytest -m "not integration" -q
