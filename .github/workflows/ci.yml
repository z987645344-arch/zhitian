name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  hnsw-wheel:
    uses: ./.github/workflows/build-hnsw-wheel.yml
  backend:
    needs: hnsw-wheel
    runs-on: windows-latest
    env:
      JWT_SECRET_KEY: ci-only-test-secret-not-for-production
      ENTERPRISE_PASSWORD_SEED: ci-only-enterprise-seed-not-for-production
      DEEPSEEK_API_KEY: ""
      TAVILY_API_KEY: ""

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Download verified CP312 wheel
        uses: actions/download-artifact@v4
        with:
          name: chroma-hnswlib-0.7.3-cp312-win_amd64
          path: hnsw-artifact

      - name: Install dependencies
        run: |
          python -m venv .venv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\.venv\Scripts\python.exe -m pip install --upgrade pip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\.venv\Scripts\python.exe scripts/build_hnsw_wheel.py --verify hnsw-artifact
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\.venv\Scripts\python.exe -m pip install --no-deps (Get-ChildItem hnsw-artifact/*.whl).FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\.venv\Scripts\python.exe -m pip install -r requirements.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\.venv\Scripts\python.exe -m pip check

      - name: Check tracked files for secrets
        shell: bash
        run: |
          if git ls-files | grep -Eq '(^|/)\.env$'; then
            echo "Tracked .env file detected"
            exit 1
          fi
          if git grep -nEI '(sk-[A-Za-z0-9_-]{20,}|tvly-[A-Za-z0-9_-]{20,})' -- .; then
            echo "Possible API key detected in tracked files"
            exit 1
          fi

      - name: Compile Python sources
        shell: bash
        run: |
          find . -type f -name '*.py' \
            -not -path './.venv/*' \
            -not -path './data/*' \
            -not -path './.git/*' \
            -print0 | xargs -0 ./.venv/Scripts/python.exe -m py_compile

      - name: Run offline test suite
        run: .\run_tests.bat -q

      - name: Test web client behavior
        run: node --test tests/web_time.test.js tests/web_source_policy.test.js tests/web_markdown.test.js
