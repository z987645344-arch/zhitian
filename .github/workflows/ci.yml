name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  hnsw-wheel:
    uses: ./.github/workflows/build-hnsw-wheel.yml
  backend:
    needs: hnsw-wheel
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    env:
      JWT_SECRET_KEY: ci-only-test-secret-not-for-production
      ENTERPRISE_PASSWORD_SEED: ci-only-enterprise-seed-not-for-production
      DEEPSEEK_API_KEY: ""
      TAVILY_API_KEY: ""

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: matrix.shard == 1
        with:
          node-version: '20'

      - name: Download verified CP312 wheel
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: chroma-hnswlib-0.7.3-cp312-win_amd64
          path: hnsw-artifact

      - name: Install dependencies
        run: |
          python -m venv .venv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\.venv\Scripts\python.exe -m pip install --upgrade pip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\.venv\Scripts\python.exe scripts/build_hnsw_wheel.py --verify hnsw-artifact
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\.venv\Scripts\python.exe -m pip install --no-deps (Get-ChildItem hnsw-artifact/*.whl).FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\.venv\Scripts\python.exe -m pip install -r requirements.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\.venv\Scripts\python.exe -m pip check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\.venv\Scripts\python.exe scripts/check_runtime_versions.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Check tracked files for secrets
        if: matrix.shard == 1
        shell: bash
        run: |
          if git ls-files | grep -Eq '(^|/)\.env$'; then
            echo "Tracked .env file detected"
            exit 1
          fi
          if git grep -nEI '(sk-[A-Za-z0-9_-]{20,}|tvly-[A-Za-z0-9_-]{20,})' -- .; then
            echo "Possible API key detected in tracked files"
            exit 1
          fi

      - name: Compile Python sources
        if: matrix.shard == 1
        shell: bash
        run: |
          find . -type f -name '*.py' \
            -not -path './.venv/*' \
            -not -path './data/*' \
            -not -path './.git/*' \
            -print0 | xargs -0 ./.venv/Scripts/python.exe -m py_compile

      - name: Run offline test suite
        run: .\.venv\Scripts\python.exe scripts/ci_test_shards.py run --shards 2 --shard ${{ matrix.shard }} --report ci-shard-reports/shard-${{ matrix.shard }}.json

      - name: Upload observed offline test IDs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: offline-test-shard-${{ matrix.shard }}
          path: ci-shard-reports/shard-${{ matrix.shard }}.json
          if-no-files-found: error

      - name: Test web client behavior
        if: matrix.shard == 1
        run: node --test tests/web_time.test.js tests/web_source_policy.test.js tests/web_markdown.test.js tests/web_text_edit.test.js

  offline-coverage:
    needs: backend
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Download observed offline test IDs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: offline-test-shard-*
          path: ci-shard-reports
          merge-multiple: true

      - name: Verify exact offline test coverage
        run: python scripts/ci_test_shards.py verify --shards 2 --reports-dir ci-shard-reports
