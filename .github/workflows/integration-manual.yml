name: Manual Integration Tests

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration:
    runs-on: windows-latest
    timeout-minutes: 60

    env:
      # 当前5项integration中只有3项聊天/生成测试需要真实DeepSeek凭据；
      # 两项LibreOffice转换测试不需要外部Secret。当前没有DirectMail集成用例。
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      JWT_SECRET_KEY: integration-ci-only-jwt-key-not-for-production-20260731
      ENTERPRISE_PASSWORD_SEED: integration-ci-only-enterprise-seed-20260731

    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Require integration secrets
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:DEEPSEEK_API_KEY)) {
            throw "缺少GitHub仓库Secret：DEEPSEEK_API_KEY"
          }

      - name: Set up Python 3.10
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Create project virtual environment
        shell: pwsh
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install --upgrade pip
          .\.venv\Scripts\python.exe -m pip install -r requirements.txt

      - name: Install LibreOffice for conversion integrations
        shell: pwsh
        run: |
          choco install libreoffice-fresh --yes --no-progress
          $candidates = @(
            "C:\Program Files\LibreOffice\program\soffice.exe",
            "C:\Program Files (x86)\LibreOffice\program\soffice.exe"
          )
          $soffice = $candidates | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          if (-not $soffice) {
            throw "LibreOffice安装完成后仍未找到soffice.exe"
          }
          "LIBREOFFICE_PATH=$soffice" >> $env:GITHUB_ENV

      - name: Run the five existing integration tests
        shell: cmd
        run: |
          if not exist integration-results mkdir integration-results
          call run_tests.bat -q -m integration --junitxml=integration-results/integration-junit.xml

      - name: Upload integration report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: integration-results-${{ github.sha }}
          path: integration-results/
          if-no-files-found: warn
          retention-days: 14
