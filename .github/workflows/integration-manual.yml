name: Manual Integration Tests

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Build both Python 3.12 images
        run: |
          docker build -t conversion-integration-api .
          docker build -f converter_service/Dockerfile -t conversion-integration-service .
      - name: Run all five real integrations in isolated Linux containers
        env:
          ZHITIAN_INTEGRATION_MODEL_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$ZHITIAN_INTEGRATION_MODEL_KEY"
          mkdir -p integration-results
          bash scripts/check_conversion_integration.sh conversion-integration-api conversion-integration-service --models \
            2>&1 | tee integration-results/integration.log
      - name: Upload integration report
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: integration-results-${{ github.sha }}
          path: integration-results/
          if-no-files-found: warn
          retention-days: 14
