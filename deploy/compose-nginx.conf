worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    sendfile on;
    keepalive_timeout 65;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    server {
        listen 8080;
        server_name _;

        client_max_body_size 25m;
        resolver 127.0.0.11 valid=30s ipv6=off;

        # 本server监听容器内8080、由宿主机80映射进来。若让nginx生成绝对
        # 重定向，Location会带上内部端口（http://host:8080/...），而该端口
        # 对外并不存在，浏览器跟随即连接被拒。关掉后统一返回相对Location。
        absolute_redirect off;

        location /api/ {
            set $api_upstream zhitian-api:8000;
            rewrite ^/api(/.*)$ $1 break;
            proxy_pass http://$api_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            proxy_connect_timeout 10s;
            proxy_send_timeout 180s;
            proxy_read_timeout 180s;
            proxy_buffering off;
        }

        # customer网页客户端。裸路径没有index.html，入口是login.html，
        # 显式重定向而不是让上游退化成目录请求。
        location = /customer {
            return 301 /customer/login.html;
        }

        location = /customer/ {
            return 301 /customer/login.html;
        }

        # 与/api/同一手法：剥掉前缀再转发，镜像因此不感知对外路径。
        # 页面内资源用的是相对路径（./css、./js、./config.js），从
        # /customer/login.html解析出的仍在/customer/下，会一并被剥掉前缀；
        # 而config.js里的apiBaseUrl是绝对路径/api，不受本前缀影响，仍命中
        # 上面的/api/规则直达后端。
        location /customer/ {
            set $web_upstream zhitian-web:8080;
            rewrite ^/customer(/.*)$ $1 break;
            proxy_pass http://$web_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
        }

        location / {
            set $admin_upstream zhitian-admin:8080;
            proxy_pass http://$admin_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
        }
    }
}
