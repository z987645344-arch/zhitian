worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    sendfile on;
    keepalive_timeout 65;

    client_body_temp_path /tmp/nginx/client_temp;
    proxy_temp_path /tmp/nginx/proxy_temp;
    fastcgi_temp_path /tmp/nginx/fastcgi_temp;
    uwsgi_temp_path /tmp/nginx/uwsgi_temp;
    scgi_temp_path /tmp/nginx/scgi_temp;

    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        # 本站点没有index.html：入口是login.html，由反向代理把裸路径重定向过去。
        # autoindex off确保裸目录不会退化成目录列表。
        autoindex off;

        # CSP按web_client实际引用逐项核对后收紧，未照搬管理后台：
        # 页面无内联<script>与内联style属性，故script-src/style-src都不需要
        # 'unsafe-inline'；无外部域资源；无<img>与CSS url()，因此img-src不给
        # data:（比管理后台更严）；字体只用系统字体名，不涉及@font-face。
        # connect-src 'self'覆盖对同源/api的fetch，含/chat/stream的流式读取。
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # 运行时后端地址配置不做缓存，换环境重启容器即生效
        location = /config.js {
            expires -1;
            try_files $uri =404;
        }

        location ~* \.html$ {
            expires -1;
            try_files $uri =404;
        }

        location ~* \.(?:css|js|png|jpg|jpeg|gif|svg|webp|ico|woff2?)$ {
            expires 1h;
            try_files $uri =404;
        }

        location / {
            try_files $uri =404;
        }
    }
}
