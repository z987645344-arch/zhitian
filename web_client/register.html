<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>注册 · 知天</title>
    <link rel="stylesheet" href="./css/style.css?v=expert-status-1" />
  </head>
  <body class="auth-page">
    <main class="auth-shell">
      <section class="auth-intro" aria-label="产品说明">
        <div>
          <a class="brand-mark" href="./login.html" aria-label="知天登录首页">知</a>
          <h1>注册后即可开始提问。</h1>
          <p>使用常用邮箱注册，验证码 5 分钟内有效。</p>
          <div class="auth-assurances">
            <span>密码至少 10 位，含大小写字母与数字</span>
            <span>同一邮箱每日验证码次数有限</span>
            <span>注册即创建个人问答账号</span>
          </div>
        </div>
        <small>知天企业知识助手</small>
      </section>
      <div class="auth-form-area">
        <section class="auth-card">
          <div class="auth-heading">
            <p class="eyebrow">自助注册</p>
            <h1>创建账号</h1>
            <p class="muted">先获取邮箱验证码，再设置密码完成注册。</p>
          </div>
          <form id="registerForm" class="form-stack">
            <label>
              <span>邮箱</span>
              <input id="email" name="email" type="email" autocomplete="email" placeholder="请输入常用邮箱" required />
            </label>
            <label>
              <span>邮箱验证码</span>
              <span class="code-field">
                <input id="verificationCode" name="verificationCode" inputmode="numeric" maxlength="6" placeholder="6位数字" required />
                <button id="sendCodeButton" type="button" class="secondary">获取验证码</button>
              </span>
            </label>
            <label>
              <span>密码</span>
              <span class="password-field">
                <input id="password" name="password" type="password" autocomplete="new-password" placeholder="至少10位，含大小写字母和数字" required />
                <button id="togglePassword" type="button" aria-label="显示密码" aria-pressed="false">显示</button>
              </span>
            </label>
            <p id="message" class="message" aria-live="polite"></p>
            <button id="registerButton" type="submit" class="btn-block">注册并登录</button>
          </form>
          <div class="auth-link"><a href="./login.html">已有账号？直接登录</a></div>
          <a class="cross-site-link auth-cross-site" href="https://zhiliaohub.com/" target="_blank" rel="noopener noreferrer">
            <span class="cross-site-link-copy"><small>CROSS-SITE</small><strong>返回知了hub主站</strong></span>
            <span class="cross-site-link-arrow" aria-hidden="true">↗</span>
          </a>
          <p class="auth-footer">知天企业知识助手</p>
        </section>
      </div>
    </main>
    <script src="./config.js"></script>
    <script src="./js/api.js?v=expert-status-1"></script>
    <script src="./js/register.js?v=expert-status-1"></script>
  </body>
</html>
