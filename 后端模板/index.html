<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>知天管理后台</title>
  <link rel="stylesheet" href="assets/common.css" />
</head>
<body>
  <main class="login-shell">
    <section class="login-card" style="text-align:center">
      <div class="login-brand" style="margin-bottom:32px">知</div>
      <h1 class="text-headline-lg font-headline font-bold c-on-surface mb-2">知天管理后台</h1>
      <div class="flex items-center justify-center gap-3 mt-6">
        <span class="icon icon-sm animate-spin c-primary" data-icon="loader"></span>
        <p class="text-body-md c-on-surface-variant">正在检查登录状态...</p>
      </div>
    </section>
  </main>

  <script src="assets/common.js"></script>
  <script>
    var token = localStorage.getItem('auth_token');
    var role = localStorage.getItem('user_role');
    if (!token) {
      location.replace('./login.html');
    } else if (role === 'employee') {
      location.replace('./employee.html');
    } else if (role === 'reviewer') {
      location.replace('./reviewer.html');
    } else {
      localStorage.removeItem('auth_token');
      localStorage.removeItem('user_role');
      localStorage.removeItem('username');
      location.replace('./login.html');
    }
  </script>
</body>
</html>
