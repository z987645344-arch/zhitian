<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>登录 · 知天管理后台</title>
  <link rel="stylesheet" href="assets/common.css" />
</head>
<body>
  <main class="login-shell">
    <section class="login-card">
      <!-- 品牌标记 -->
      <div class="login-brand">知</div>

      <!-- 标题 -->
      <div class="text-center mb-8">
        <h1 class="text-headline-lg font-headline font-bold c-on-surface">知天管理后台</h1>
        <p class="text-body-md c-on-surface-variant opacity-60 mt-2">企业知识治理与运行诊断平台</p>
      </div>

      <!-- 登录表单 -->
      <form id="loginForm" class="flex flex-col gap-2">
        <div class="login-field">
          <label for="username">用户名</label>
          <div class="relative">
            <span class="icon icon-sm icon-left" data-icon="user-circle"></span>
            <input id="username" name="username" autocomplete="username" placeholder="请输入用户名" required />
          </div>
        </div>

        <div class="login-field">
          <label for="password">密码</label>
          <div class="relative">
            <span class="icon icon-sm icon-left" data-icon="lock"></span>
            <input id="password" name="password" type="password" autocomplete="current-password" placeholder="请输入密码" required />
          </div>
        </div>

        <p id="message" class="message" aria-live="polite"></p>

        <button id="loginButton" type="submit" class="btn btn-primary btn-block mt-2" style="padding: 12px 16px; font-size: 15px;">
          <span class="icon icon-sm" data-icon="log-in"></span>
          登录
        </button>
      </form>

      <!-- 角色提示 -->
      <div class="mt-8 flex items-center justify-center gap-6">
        <div class="flex items-center gap-2 c-on-surface-variant opacity-60">
          <span class="icon icon-sm" data-icon="user-check"></span>
          <span class="text-label-sm">员工</span>
        </div>
        <div class="flex items-center gap-2 c-on-surface-variant opacity-60">
          <span class="icon icon-sm" data-icon="shield-check"></span>
          <span class="text-label-sm">审核员</span>
        </div>
      </div>

      <!-- 底部信息 -->
      <p class="text-center text-label-sm opacity-40 mt-8">知天 Agent Platform · 管理后台 v1.9</p>
    </section>
  </main>

  <script src="assets/common.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      var form = document.getElementById("loginForm");
      var msg = document.getElementById("message");
      var btn = document.getElementById("loginButton");

      form.addEventListener("submit", function (e) {
        e.preventDefault();
        var u = document.getElementById("username").value.trim();
        var p = document.getElementById("password").value;

        if (!u || !p) {
          msg.textContent = "请填写用户名和密码";
          msg.className = "message message-error";
          return;
        }

        // 模拟登录逻辑
        btn.innerHTML = '<span class="icon icon-sm animate-spin" data-icon="loader"></span> 登录中...';
        btn.disabled = true;
        renderIcons(btn);

        setTimeout(function () {
          // 演示：用户名包含 reviewer 则为审核员，否则为员工
          var role = u.toLowerCase().indexOf("review") >= 0 ? "reviewer" : "employee";
          localStorage.setItem("auth_token", "demo_token_" + Date.now());
          localStorage.setItem("user_role", role);
          localStorage.setItem("username", u);

          msg.textContent = "登录成功，正在跳转...";
          msg.className = "message message-success";

          setTimeout(function () {
            location.replace(role === "reviewer" ? "reviewer.html" : "employee.html");
          }, 600);
        }, 800);
      });
    });
  </script>
</body>
</html>
